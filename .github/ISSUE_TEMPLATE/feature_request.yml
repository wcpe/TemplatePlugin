# 功能建议表单（GitHub 原生 YAML 表单）
# 读取方：GitHub Issues。标题会自动带上 [功能] 前缀，便于与缺陷区分。
name: 功能建议
description: 提出新功能、改进方向或模板定制需求
title: "[功能] "
labels:
  - "功能建议"
  - "增强"
body:
  - type: markdown
    attributes:
      value: |
        感谢提建议！本仓库是供二次开发的插件模板，评估时会优先考虑
        **多数派生项目都会用得上**、且**不会给模板增加长期维护负担**的需求。
        请把「想解决的问题」写清楚，比直接罗列功能更容易被采纳。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 必填。现在遇到的是什么麻烦？当前怎么绕过去的？说明问题比描述功能更能帮助判断价值。
      placeholder: 例如：每次新增配置项都要同时改 data class、默认配置和 reload 监听，容易漏改导致配置不生效。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你设想的做法或期望的使用体验。若有多个方案，可以都写上并说明偏好哪一个。
      placeholder: 例如：约定配置项统一由注解 + 反射注册，新增配置项只需写一个 data class。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可填。写下你评估过但放弃的方案及放弃原因，能避免评审方重复讨论同样的路线。
      placeholder: 例如：考虑过用单独的 ConfigManager 手动注册，但样板代码更多，且与 reload 逻辑容易脱节。
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 涉及范围
      description: 可填。这个需求属于「仅自己项目要用」，还是「模板级通用能力」？后者更容易被合并进模板。
      placeholder: 例如：属于模板级通用能力，api / core / plugin 三个模块都会用到。
    validations:
      required: false

  - type: checkboxes
    id: extras
    attributes:
      label: 补充信息
    options:
      - label: 我愿意为该功能补充测试用例
      - label: 我愿意为该功能补充文档（README / ARCHITECTURE / docs/API）
      - label: 该功能会引入新的依赖或改变现有行为，可以接受相应取舍
