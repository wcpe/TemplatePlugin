# 持续集成：在 master 推送与 PR 上执行测试、构建，并上传插件产物
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 仅需读取代码；上传 workflow 产物无需写权限
permissions:
  contents: read

# 同一引用上有新提交时，取消仍在运行的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试与构建
    runs-on: self-hosted
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # 工程编译目标为 Java 8（见根 build.gradle.kts 的 toolchain，由 foojay resolver 自动供给 JDK 8）。
      # 构建/配置过程需运行在 JDK 17+：top.wcpe.taboolib.ioc 插件（Java 17 字节码）无法在 JDK 8 上加载。
      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 仓库内 gradlew 为非可执行权限，Linux 运行器需手动补上执行位
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # build 任务包含全模块编译与 JUnit 5 测试
      - name: 构建与测试
        run: ./gradlew build --stacktrace --no-daemon

      # 仅在前序步骤成功时上传，缺少产物视为失败
      - name: 上传插件产物
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-jar
          path: plugin/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
