# 持续集成：在 master 推送与 PR 上执行测试、构建，并上传插件产物
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 仅需读取代码；上传 workflow 产物无需写权限
permissions:
  contents: read

# 同一引用上有新提交时，取消仍在运行的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 工程编译目标为 Java 8（见根 build.gradle.kts 的 toolchain），故 CI 直接使用 JDK 8
      - name: 配置 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      # 仓库内 gradlew 为非可执行权限，Linux 运行器需手动补上执行位
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # build 任务包含全模块编译与 JUnit 5 测试
      - name: 构建与测试
        run: ./gradlew build --stacktrace --no-daemon

      # 仅在前序步骤成功时上传，缺少产物视为失败
      - name: 上传插件产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: plugin/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
