# 持续集成：在 master 推送与 PR 上执行测试与构建。
# 不向 GitHub 上传 workflow 制品：自托管 runner 上的构建产物可直接就地取用，
# 上传既挤占制品存储配额，又会在收尾阶段产生额外开销。
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 仅需读取代码
permissions:
  contents: read

# 同一引用上有新提交时，取消仍在运行的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试与构建
    # 定向到确定机队：裸写 self-hosted 会匹配任意自托管 runner，实测三次运行分别落到
    # 三台不同机器上，各机缓存与环境状态不一致（其中之一挂死 30 分钟无输出）。
    # 与同组织其他项目保持一致的标签集。
    runs-on: [self-hosted, linux]
    # 超时上限（分钟）：这是兜底而非常规耗时。正常 runner 上约 3 分钟；经代理的慢 runner
    # 上首次运行需冷下载全部依赖，会显著更久（但应在推进）。若真挂死，也会以明确失败收场
    # 而非无限 pending 拖满 GitHub 默认的 360 分钟。
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 工程编译目标为 Java 8（见根 build.gradle.kts 的 toolchain，由 foojay resolver 自动供给 JDK 8）。
      # 构建/配置过程需运行在 JDK 17+：top.wcpe.taboolib.ioc 插件（Java 17 字节码）无法在 JDK 8 上加载。
      # 不启用 setup-java 的 gradle 缓存：自托管 runner 的 ~/.gradle 本就持久存在，
      # 交给 actions/cache 打包上传没有收益，缓存体积还会超过 10GB 上限，
      # 导致收尾步骤白白空转 tar 压缩后依然保存失败。
      - name: 配置 JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      # 仓库内 gradlew 为非可执行权限，Linux 运行器需手动补上执行位
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 质量门禁前置阻断：check 汇总 PMD / Checkstyle / SpotBugs / Error Prone /
      # detekt / ktlint 与 JUnit 5 测试，任何一项失败都在此处终止，不进入产物阶段。
      - name: 质量门禁与测试
        run: |
          env -u JAVA_TOOL_OPTIONS -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
            GRADLE_OPTS="-Dhttps.protocols=TLSv1.3,TLSv1.2 -Djdk.tls.client.protocols=TLSv1.3,TLSv1.2${GRADLE_OPTS:+ $GRADLE_OPTS}" \
            ./gradlew check --stacktrace --no-daemon

      # build = assemble + check，此处复用上一步的 up-to-date 结果，只补齐产物打包
      - name: 构建产物
        run: |
          env -u JAVA_TOOL_OPTIONS -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u all_proxy \
            GRADLE_OPTS="-Dhttps.protocols=TLSv1.3,TLSv1.2 -Djdk.tls.client.protocols=TLSv1.3,TLSv1.2${GRADLE_OPTS:+ $GRADLE_OPTS}" \
            ./gradlew build --stacktrace --no-daemon
