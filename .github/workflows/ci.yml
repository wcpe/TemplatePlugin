# 持续集成：在 master 推送与 PR 上执行测试与构建。
# 不向 GitHub 上传 workflow 制品：自托管 runner 上的构建产物可直接就地取用，
# 上传既挤占制品存储配额，又会在收尾阶段产生额外开销。
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 仅需读取代码
permissions:
  contents: read

# 同一引用上有新提交时，取消仍在运行的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试与构建
    runs-on: self-hosted
    # 作业超时上限（分钟）：收尾步骤会长时间没有日志输出，一旦挂死不至于拖满 GitHub 默认的 360 分钟
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # 工程编译目标为 Java 8（见根 build.gradle.kts 的 toolchain，由 foojay resolver 自动供给 JDK 8）。
      # 构建/配置过程需运行在 JDK 17+：top.wcpe.taboolib.ioc 插件（Java 17 字节码）无法在 JDK 8 上加载。
      # 不启用 setup-java 的 gradle 缓存：自托管 runner 的 ~/.gradle 本就持久存在，
      # 交给 actions/cache 打包上传没有收益，缓存体积还会超过 10GB 上限，
      # 导致收尾步骤白白空转 tar 压缩后依然保存失败。
      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      # 仓库内 gradlew 为非可执行权限，Linux 运行器需手动补上执行位
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 质量门禁前置阻断：任何规则违规都在此处失败，不会进入后续构建与产物阶段。
      # 必须带 -PenableErrorProne：该开关同时把 toolchain 切到 JDK 17（CI 运行器已是 JDK 17）。
      - name: 质量门禁
        run: ./gradlew qualityCheck -PenableErrorProne --stacktrace --no-daemon

      # build 任务包含全模块编译与 JUnit 5 测试
      - name: 构建与测试
        run: ./gradlew build --stacktrace --no-daemon
