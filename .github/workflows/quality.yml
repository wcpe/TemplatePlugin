# 代码质量门禁：与 ci.yml（JDK 17 纯编译+测试）解耦的独立工作流。
#   - Java：SpotBugs(+FindSecBugs) / Error Prone / PMD / Checkstyle / JaCoCo
#   - Kotlin：detekt / ktlint / Kover
#   - 安全：FindSecBugs（挂 SpotBugs）+ detekt 自带规则 + Semgrep
# 质量工具需运行在 JDK 17 上（编译产物仍为 Java 8 字节码）。
name: Quality

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 仅需读取代码
permissions:
  contents: read

# 同一引用上有新提交时取消旧任务
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-quality:
    name: Gradle 质量门禁
    runs-on: self-hosted
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # 质量工具（SpotBugs/detekt/Checkstyle 10/PMD 7 等）要求 JDK 11+，此处用 JDK 17；
      # 配合 -PenableErrorProne，编译以 JDK 17 + --release 8 产出 Java 8 字节码
      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # qualityCheck 聚合全部质量门禁与覆盖率报告；任一规则违规即失败（严格阻断）
      - name: 运行质量门禁
        run: ./gradlew qualityCheck -PenableErrorProne --stacktrace --no-daemon

      # 无论成败都上传报告，便于排查（HTML/XML 报告位于各模块 build/reports）
      - name: 上传质量报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 14

  semgrep:
    name: Semgrep 安全审查
    runs-on: self-hosted
    # 官方镜像内置 semgrep，使用公共规则集，无需登录令牌
    container:
      image: semgrep/semgrep
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # 发现问题时返回非零退出码以阻断（--error）
      - name: 运行 Semgrep
        run: >-
          semgrep scan
          --config p/default
          --config p/java
          --config p/kotlin
          --config p/secrets
          --error
